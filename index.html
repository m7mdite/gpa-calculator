<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>علاماتي: المعدل والإحصائيات</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>علاماتي</h1>
    <div class="acts">
      <button class="btn" id="btnUpload" type="button">رفع ملف CSV</button>
      <button class="btn" id="btnPaste" type="button">لصق الجدول</button>
      <button class="btn" id="btnExport" type="button" hidden>تنزيل CSV</button>
      <button class="btn" id="btnReset" type="button" hidden>استعادة الأصل</button>
      <button class="btn danger" id="btnClear" type="button" hidden>مسح الكل</button>
      <input id="file" type="file" accept=".csv,.tsv,.txt,text/csv,text/plain" hidden>
    </div>
  </div>

  <section class="hero" id="hero" aria-label="المعدل العام"></section>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabCourses" aria-selected="true" type="button">المواد</button>
    <button role="tab" id="tabStats" aria-selected="false" type="button">الإحصائيات</button>
  </div>

  <div id="viewCourses"></div>
  <div id="viewStats" hidden></div>
  <noscript><p>هذه الصفحة تحتاج JavaScript لتعمل.</p></noscript>
</div>

<button class="fab" id="fab" type="button">إضافة مادة</button>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg">
  <form class="dlg" id="form" autocomplete="off">
    <h2 id="dlgTitle">إضافة مادة</h2>
    <div class="fld"><label for="fName">اسم المقرر</label><input id="fName" type="text" maxlength="80"></div>
    <div class="grid2">
      <div class="fld"><label for="fCy">سنة المقرر</label><select id="fCy"></select></div>
      <div class="fld"><label for="fSem">الفصل</label>
        <select id="fSem"><option>فصل أول</option><option>فصل ثاني</option><option>فصل صيفي</option></select></div>
    </div>
    <div class="fld"><label for="fAy">عام التقديم (مثال: 2025-2026)</label>
      <input id="fAy" type="text" inputmode="text" list="ayList" placeholder="2025-2026"><datalist id="ayList"></datalist></div>
    <div class="grid3">
      <div class="fld"><label for="fP">علامة العملي</label><input id="fP" type="text" inputmode="decimal"></div>
      <div class="fld"><label for="fE">علامة الامتحان</label><input id="fE" type="text" inputmode="decimal"></div>
      <div class="fld"><label for="fF">النهائية</label><input id="fF" type="text" inputmode="decimal"></div>
    </div>
    <div class="fld"><label for="fH">عدد الساعات (اختياري، للمعدل المرجّح)</label><input id="fH" type="text" inputmode="decimal"></div>
    <p class="prev num" id="prev"></p>
    <p class="err" id="err" role="alert"></p>
    <div class="dacts">
      <button class="btn danger" id="btnDel" type="button">حذف المادة</button>
      <div class="grp">
        <button class="btn" id="btnCancel" type="button">إلغاء</button>
        <button class="btn primary" id="btnSave" type="submit">حفظ</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="pdlg">
  <form class="dlg" id="pform" autocomplete="off">
    <h2>لصق جدول العلامات</h2>
    <p class="small">افتح موقع الجامعة واضغط «استعلام»، ثم حدّد الجدول كاملاً وانسخه (Ctrl+C) والصقه هنا. يمكنك أيضاً لصق محتوى ملف CSV.</p>
    <textarea class="paste" id="pText" aria-label="لصق جدول العلامات"></textarea>
    <p class="err" id="perr" role="alert"></p>
    <div class="dacts">
      <span></span>
      <div class="grp">
        <button class="btn" id="pCancel" type="button">إلغاء</button>
        <button class="btn primary" type="submit">تحليل</button>
      </div>
    </div>
  </form>
</dialog>

<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
